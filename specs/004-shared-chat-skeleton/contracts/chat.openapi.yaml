openapi: 3.1.0
info: { title: Shared Chat API, version: 0.1.0 }
paths:
  /api/v1/{product}/conversations:
    post:
      parameters: [{ in: path, name: product, required: true, schema: { enum: [liara, zarinpal] } }]
      responses: { '201': { description: Conversation credentials } }
  /api/v1/{product}/conversations/{id}:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Conversation and messages }, '404': { description: Missing or cross-product conversation } }
  /api/v1/{product}/conversations/{id}/messages:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: SSE message stream, content: { text/event-stream: {} } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer } }
