openapi: 3.1.0
info:
  title: Hackathon API Baseline
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
