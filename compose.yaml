x-gateway-environment: &gateway-environment
  AI_GATEWAY_MODEL_NAME: ${AI_GATEWAY_MODEL_NAME:-liara-docs}
  AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-fixture-provider-model}
  AI_GATEWAY_API_BASE: ${AI_GATEWAY_API_BASE:-http://mock-upstream:8080/v1}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-fixture-secret-not-for-production}
  AI_GATEWAY_REDIS_URL: ${AI_GATEWAY_REDIS_URL:-redis://redis:6379/0}
  AI_GATEWAY_DEPLOYMENT_ID: ${AI_GATEWAY_DEPLOYMENT_ID:-local-hackathon}
  AI_GATEWAY_ENFORCEMENT_EPOCH: ${AI_GATEWAY_ENFORCEMENT_EPOCH:-local-v1}
  AI_GATEWAY_IDENTITY_SECRET: ${AI_GATEWAY_IDENTITY_SECRET:-0123456789abcdef0123456789abcdef}
  AI_GATEWAY_MODEL_MAX_INPUT_TOKENS: ${AI_GATEWAY_MODEL_MAX_INPUT_TOKENS:-8192}
  AI_GATEWAY_CORS_ALLOW_ORIGINS: ${AI_GATEWAY_CORS_ALLOW_ORIGINS:-http://localhost:3001}
  AI_GATEWAY_TRUSTED_PROXY_CIDRS: ${AI_GATEWAY_TRUSTED_PROXY_CIDRS:-}
  AI_GATEWAY_ALLOW_INSECURE_LOCAL_UPSTREAM: ${AI_GATEWAY_ALLOW_INSECURE_LOCAL_UPSTREAM:-true}
  AI_GATEWAY_ALLOW_PRIVATE_UPSTREAM: ${AI_GATEWAY_ALLOW_PRIVATE_UPSTREAM:-true}
  AI_GATEWAY_CLIENT_RPM: ${AI_GATEWAY_CLIENT_RPM:-60}
  AI_GATEWAY_CLIENT_TPM: ${AI_GATEWAY_CLIENT_TPM:-100000}
  AI_GATEWAY_CLIENT_MAX_CONCURRENCY: ${AI_GATEWAY_CLIENT_MAX_CONCURRENCY:-4}
  AI_GATEWAY_CLIENT_QUOTA_TOKENS: ${AI_GATEWAY_CLIENT_QUOTA_TOKENS:-1000000}
  AI_GATEWAY_CLIENT_QUOTA_WINDOW_SECONDS: ${AI_GATEWAY_CLIENT_QUOTA_WINDOW_SECONDS:-86400}
  AI_GATEWAY_GLOBAL_RPM: ${AI_GATEWAY_GLOBAL_RPM:-1000}
  AI_GATEWAY_GLOBAL_TPM: ${AI_GATEWAY_GLOBAL_TPM:-2000000}
  AI_GATEWAY_GLOBAL_MAX_CONCURRENCY: ${AI_GATEWAY_GLOBAL_MAX_CONCURRENCY:-100}
  AI_GATEWAY_GLOBAL_QUOTA_TOKENS: ${AI_GATEWAY_GLOBAL_QUOTA_TOKENS:-50000000}
  AI_GATEWAY_GLOBAL_QUOTA_WINDOW_SECONDS: ${AI_GATEWAY_GLOBAL_QUOTA_WINDOW_SECONDS:-86400}
  AI_GATEWAY_MAX_REQUEST_SECONDS: ${AI_GATEWAY_MAX_REQUEST_SECONDS:-120}
  AI_GATEWAY_MAX_STREAM_SECONDS: ${AI_GATEWAY_MAX_STREAM_SECONDS:-300}
  AI_GATEWAY_RECONCILIATION_GRACE_SECONDS: ${AI_GATEWAY_RECONCILIATION_GRACE_SECONDS:-60}
  AI_GATEWAY_LIARA_GROUNDING_ENABLED: ${AI_GATEWAY_LIARA_GROUNDING_ENABLED:-true}
  AI_GATEWAY_MEILI_URL: ${AI_GATEWAY_MEILI_URL:-http://meilisearch:7700}
  AI_GATEWAY_MEILI_API_KEY: ${AI_GATEWAY_MEILI_API_KEY:-fixture-meili-key-not-for-production}
  AI_GATEWAY_LIARA_INDEX_UID: ${AI_GATEWAY_LIARA_INDEX_UID:-liara_docs_active}
  AI_GATEWAY_LIARA_CORPUS_REVISION: ${AI_GATEWAY_LIARA_CORPUS_REVISION:-4aa2555f40e7b5d67be2b96bcf5025655dace036aaae2b121686a4d1362fbd03}
  AI_GATEWAY_RETRIEVAL_POLICY_VERSION: ${AI_GATEWAY_RETRIEVAL_POLICY_VERSION:-retrieval-v1}
  AI_GATEWAY_PROMPT_VERSION: ${AI_GATEWAY_PROMPT_VERSION:-prompt-v1}
  AI_GATEWAY_CACHE_HMAC_SECRET: ${AI_GATEWAY_CACHE_HMAC_SECRET:-abcdef0123456789abcdef0123456789}
  AI_GATEWAY_METRICS_TOKEN: ${AI_GATEWAY_METRICS_TOKEN:-fixture-metrics-token-not-for-production}
  AI_GATEWAY_ALLOW_UNAUTHENTICATED_METRICS: ${AI_GATEWAY_ALLOW_UNAUTHENTICATED_METRICS:-true}
  AI_GATEWAY_ALLOW_INSECURE_LOCAL_MEILI: ${AI_GATEWAY_ALLOW_INSECURE_LOCAL_MEILI:-true}
  AI_GATEWAY_DIRECT_CONTEXT_TOKENS: ${AI_GATEWAY_DIRECT_CONTEXT_TOKENS:-2500}
  AI_GATEWAY_DIRECT_OUTPUT_TOKENS: ${AI_GATEWAY_DIRECT_OUTPUT_TOKENS:-600}
  AI_GATEWAY_COMPLEX_CONTEXT_TOKENS: ${AI_GATEWAY_COMPLEX_CONTEXT_TOKENS:-6000}
  AI_GATEWAY_COMPLEX_OUTPUT_TOKENS: ${AI_GATEWAY_COMPLEX_OUTPUT_TOKENS:-1200}
  AI_GATEWAY_CLARIFY_OUTPUT_TOKENS: ${AI_GATEWAY_CLARIFY_OUTPUT_TOKENS:-200}
  AI_GATEWAY_INPUT_COST_MICRO_PER_MILLION: ${AI_GATEWAY_INPUT_COST_MICRO_PER_MILLION:-1000000}
  AI_GATEWAY_OUTPUT_COST_MICRO_PER_MILLION: ${AI_GATEWAY_OUTPUT_COST_MICRO_PER_MILLION:-2000000}
  AI_GATEWAY_DAILY_COST_BUDGET_MICRO: ${AI_GATEWAY_DAILY_COST_BUDGET_MICRO:-100000000}

services:
  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${AI_GATEWAY_MEILI_API_KEY:-fixture-meili-key-not-for-production}
    ports: ["127.0.0.1:${MEILISEARCH_HOST_PORT:-7700}:7700"]
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:7700/health"]
      interval: 3s
      timeout: 2s
      retries: 30

  index-bootstrap:
    build:
      context: .
      dockerfile: deploy/liara/Dockerfile.index-bootstrap
    working_dir: /workspace
    environment:
      AI_GATEWAY_MEILI_URL: http://meilisearch:7700
      AI_GATEWAY_MEILI_API_KEY: ${AI_GATEWAY_MEILI_API_KEY:-fixture-meili-key-not-for-production}
      AI_GATEWAY_LIARA_INDEX_UID: ${AI_GATEWAY_LIARA_INDEX_UID:-liara_docs_active}
      AI_GATEWAY_MEILI_TASK_TIMEOUT_MS: ${AI_GATEWAY_MEILI_TASK_TIMEOUT_MS:-600000}
    command:
      - /bin/sh
      - -ec
      - >-
        pnpm liara:index:build &&
        node -e "fetch('http://meilisearch:7700/indexes',{method:'POST',headers:{authorization:'Bearer '+process.env.AI_GATEWAY_MEILI_API_KEY,'content-type':'application/json'},body:JSON.stringify({uid:process.env.AI_GATEWAY_LIARA_INDEX_UID,primaryKey:'id'})}).then(r=>{if(!r.ok&&r.status!==409)throw Error('active index bootstrap failed')})" &&
        pnpm liara:index:publish && pnpm liara:index:activate
    depends_on:
      meilisearch: { condition: service_healthy }
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6389}:6379"]
    volumes:
      - ./ai-gw/deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  gateway-bootstrap:
    build: ./ai-gw
    command: ["/app/.venv/bin/ai-gateway-bootstrap"]
    environment: *gateway-environment
    depends_on:
      redis: { condition: service_healthy }
    restart: "no"

  mock-upstream:
    build: ./ai-gw
    command:
      [
        "/app/.venv/bin/uvicorn",
        "tests.fixtures.mock_openai_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--no-access-log",
        "--no-server-header",
      ]
    volumes:
      - ./ai-gw/tests:/app/tests:ro
    environment:
      MOCK_UPSTREAM_API_KEY: fixture-secret-not-for-production
    ports: ["127.0.0.1:${MOCK_UPSTREAM_HOST_PORT:-8080}:8080"]

  gateway:
    build: ./ai-gw
    environment: *gateway-environment
    ports: ["${AI_GATEWAY_PORT:-4000}:4000"]
    depends_on:
      redis: { condition: service_healthy }
      gateway-bootstrap: { condition: service_completed_successfully }
      mock-upstream: { condition: service_started }
      index-bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  liara:
    build:
      context: .
      dockerfile: apps/liara-docs/Dockerfile.monorepo
      args:
        NEXT_PUBLIC_AI_GATEWAY_URL: ${NEXT_PUBLIC_AI_GATEWAY_URL:-http://localhost:4000}
    ports: ["${LIARA_HOST_PORT:-3001}:8080"]

  zarinpal:
    build:
      context: .
      dockerfile: apps/zarin-dashboard/Dockerfile
    ports: ["${ZARINPAL_HOST_PORT:-3002}:3002"]

volumes:
  redis-data:
  meilisearch-data:
