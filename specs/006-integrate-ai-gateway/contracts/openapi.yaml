openapi: 3.1.0
info:
  title: Liara AI Gateway Consumer Profile
  version: 1.0.0
  description: >-
    Browser-consumed subset of the authoritative FastAPI /openapi.json contract. Anonymous,
    single-model OpenAI-compatible surface consumed by Liara Docs. The gateway accepts no real
    client credential. An optional non-secret Bearer placeholder is tolerated for OpenAI client
    compatibility and is never forwarded upstream. Automated parity tests must prove every
    operation and schema in this profile is accepted by the live producer contract.
x-contract-role: liara-consumer-profile
servers:
  - url: http://localhost:4000
    description: Deterministic local gateway
security: []
paths:
  /v1/models:
    get:
      operationId: listModels
      summary: List the single public model alias
      parameters:
        - $ref: "#/components/parameters/OptionalPlaceholderAuthorization"
      responses:
        "200":
          description: Exactly one public model
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        default:
          $ref: "#/components/responses/OpenAIError"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a stateless chat completion
      parameters:
        - $ref: "#/components/parameters/OptionalPlaceholderAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: >-
            A non-streaming completion when stream is false, or ordered SSE data events followed
            exactly once by data: [DONE] when stream is true.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              schema:
                type: string
                description: >-
                  Each data event is a ChatCompletionChunk; final event is [DONE]. A failure after
                  HTTP 200 terminates without [DONE] and is handled as an incomplete stream.
                x-data-event-schema:
                  $ref: "#/components/schemas/ChatCompletionChunk"
        "400":
          $ref: "#/components/responses/OpenAIError"
        "413":
          $ref: "#/components/responses/OpenAIError"
        "415":
          $ref: "#/components/responses/OpenAIError"
        "429":
          $ref: "#/components/responses/OpenAIError"
        "500":
          $ref: "#/components/responses/OpenAIError"
        "502":
          $ref: "#/components/responses/OpenAIError"
        "503":
          $ref: "#/components/responses/OpenAIError"
        "504":
          $ref: "#/components/responses/OpenAIError"
  /health/liveness:
    get:
      operationId: getLiveness
      summary: Check whether the process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/readiness:
    get:
      operationId: getReadiness
      summary: Check configuration and Redis enforcement readiness
      description: Upstream-provider reachability is deliberately excluded.
      responses:
        "200":
          description: Configuration and enforcement state are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: Redis enforcement state is unavailable or inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReady"
components:
  parameters:
    OptionalPlaceholderAuthorization:
      in: header
      name: Authorization
      required: false
      description: Optional non-secret compatibility placeholder; never used for authorization.
      schema:
        type: string
        pattern: "^Bearer .+$"
  headers:
    RequestId:
      description: Opaque support correlation identifier generated by the gateway.
      schema:
        type: string
        format: uuid
  responses:
    OpenAIError:
      description: Sanitized OpenAI-compatible error detected before streaming headers are sent
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        object:
          const: model
        created:
          const: 0
        owned_by:
          const: ai-gateway
    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          const: list
        data:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/Model"
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant]
        content:
          type: string
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        messages:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: false
        max_completion_tokens:
          type: integer
          minimum: 1
    Usage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    AssistantMessage:
      type: object
      additionalProperties: true
      required: [role, content]
      properties:
        role:
          const: assistant
        content:
          type: string
    CompletionChoice:
      type: object
      additionalProperties: true
      required: [index, message]
      properties:
        index:
          type: integer
          minimum: 0
        message:
          $ref: "#/components/schemas/AssistantMessage"
        finish_reason:
          type: [string, "null"]
    ChatCompletion:
      type: object
      additionalProperties: true
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/CompletionChoice"
        usage:
          $ref: "#/components/schemas/Usage"
    Delta:
      type: object
      additionalProperties: true
      properties:
        role:
          const: assistant
        content:
          type: [string, "null"]
    ChunkChoice:
      type: object
      additionalProperties: true
      required: [index, delta]
      properties:
        index:
          type: integer
          minimum: 0
        delta:
          $ref: "#/components/schemas/Delta"
        finish_reason:
          type: [string, "null"]
    ChatCompletionChunk:
      type: object
      additionalProperties: true
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          const: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChunkChoice"
        usage:
          $ref: "#/components/schemas/Usage"
    ErrorObject:
      type: object
      additionalProperties: false
      required: [message, type, param, code]
      properties:
        message:
          type: string
          maxLength: 512
        type:
          type: string
          maxLength: 64
        param:
          type: [string, "null"]
          maxLength: 64
        code:
          type: string
          maxLength: 64
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: alive
    Ready:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ready
    NotReady:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: not_ready
