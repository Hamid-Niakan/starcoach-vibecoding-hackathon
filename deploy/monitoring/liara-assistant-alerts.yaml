groups:
  - name: liara-assistant
    interval: 30s
    rules:
      - alert: LiaraAssistantNotReady
        expr: ai_gateway_ready == 0
        for: 2m
        labels: { severity: critical, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Gateway is not ready",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#not-ready",
          }
      - alert: LiaraAssistantLogDrops
        expr: increase(ai_gateway_log_events_dropped_total[5m]) > 0
        for: 1m
        labels: { severity: critical, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Structured events are being dropped",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#log-drops",
          }
      - alert: LiaraAssistantHigh5xx
        expr: sum(rate(ai_gateway_chat_requests_total{outcome=~"upstream_error|internal_error|malformed_upstream"}[5m])) / clamp_min(sum(rate(ai_gateway_chat_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical, owner: liara-assistant-operators }
        annotations:
          {
            summary: "5xx-equivalent outcomes exceed 5%",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#high-5xx",
          }
      - alert: LiaraAssistantTimeouts
        expr: sum(rate(ai_gateway_chat_requests_total{outcome="timeout"}[10m])) / clamp_min(sum(rate(ai_gateway_chat_requests_total[10m])), 0.001) > 0.02
        for: 10m
        labels: { severity: warning, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Timeout outcomes exceed 2%",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#timeouts",
          }
      - alert: LiaraAssistantSlowTTFT
        expr: histogram_quantile(0.95, sum by (le) (rate(ai_gateway_grounding_ttft_seconds_bucket[10m]))) > 2
        for: 10m
        labels: { severity: warning, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Grounded TTFT p95 exceeds two seconds",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#slow-ttft",
          }
      - alert: LiaraAssistantSlowCompletion
        expr: histogram_quantile(0.95, sum by (le) (rate(ai_gateway_chat_request_duration_seconds_bucket[10m]))) > 30
        for: 10m
        labels: { severity: warning, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Completion latency p95 exceeds SLO",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#slow-completion",
          }
      - alert: LiaraAssistantLimitExhaustion
        expr: sum(rate(ai_gateway_limit_rejections_total[10m])) > 1
        for: 5m
        labels: { severity: warning, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Limits or quotas are being exhausted",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#limit-exhaustion",
          }
      - alert: LiaraAssistantRetrievalAnomaly
        expr: histogram_quantile(0.95, sum by (le) (rate(ai_gateway_grounding_retrieval_duration_seconds_bucket[10m]))) > 3
        for: 10m
        labels: { severity: warning, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Retrieval latency is anomalous",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#retrieval-anomaly",
          }
      - alert: LiaraAssistantCacheAnomaly
        expr: sum(rate(ai_gateway_grounding_cache_total{outcome="error"}[10m])) > 0.1
        for: 10m
        labels: { severity: warning, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Grounding cache errors increased",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#cache-anomaly",
          }
      - alert: LiaraAssistantDailyCostWarning
        expr: increase(ai_gateway_estimated_cost_micro_units_total[24h]) / clamp_min(ai_gateway_daily_cost_budget_micro_units, 1) > 0.8
        for: 5m
        labels: { severity: warning, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Daily estimated cost exceeds 80%",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#daily-cost",
          }
      - alert: LiaraAssistantDailyCostCritical
        expr: increase(ai_gateway_estimated_cost_micro_units_total[24h]) / clamp_min(ai_gateway_daily_cost_budget_micro_units, 1) >= 1
        for: 1m
        labels: { severity: critical, owner: liara-assistant-operators }
        annotations:
          {
            summary: "Daily estimated cost reached budget",
            runbook_url: "../../ai-gw/docs/liara-assistant-operations.md#daily-cost",
          }
